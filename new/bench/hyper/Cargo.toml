[package]
name    = "hyper-bare"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio      = { version = "=1.53.1", features = ["rt", "net", "time"] }
hyper      = { version = "=1.11.1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server-auto"] }
http       = "1.5.0"
socket2    = { version = "0.6.5", features = ["all"] }
mimalloc   = "0.1.52"
core_affinity = "0.8.3"

[profile.release]
opt-level     = 3
codegen-units = 1
lto           = "fat"
panic         = "abort"
strip         = "symbols"

[profile.profiling]
inherits = "release"
debug    = 1
strip    = "none"
