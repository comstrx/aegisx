[package]
name         = "aegisx"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.98"
license      = "MIT OR Apache-2.0"
description  = "Local reverse proxy with observable request lifecycles and optional inference"
authors      = ["comstrx <comstrx@gmail.com>"]
repository   = "https://github.com/comstrx/aegisx"

[lib]
name = "aegisx"
path = "src/lib.rs"

[[bin]]
name = "aegisx"
path = "src/main.rs"

[dependencies]
tokio              = { version = "1.53.1", features = ["rt", "net", "time", "sync", "signal", "macros", "io-util", "fs"] }
hyper              = { version = "1.11.1", features = ["http1", "http2", "server", "client"] }
hyper-util         = { version = "0.1.21", features = ["tokio", "client-legacy", "http1", "http2"] }
tower-service      = "0.3.3"
send_wrapper       = "0.6.0"
tokio-io-timeout   = "1.2.1"
tokio-util         = { version = "0.7.19", features = ["io"] }
futures-util       = { version = "0.3.34", default-features = false, features = ["std"] }
async-stream       = "0.3.6"
fastcgi-client     = { version = "0.12.0", features = ["tokio"] }
http               = "1.5.0"
http-body          = "1.1.0"
http-body-util     = "0.1.5"
bytes              = "1.12.1"
socket2            = { version = "0.6.5", features = ["all"] }
core_affinity      = "0.8.3"
arc-swap           = "1.9.2"
clap               = { version = "4.6.7", features = ["derive"] }
thiserror          = "2.0.21"
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
mimalloc           = "0.1.52"
rlimit             = "0.11.0"
matchit            = "0.9.2"
memchr             = "2.8.3"
httparse           = "1.10.1"
http-range-header  = "0.4.2"
maxminddb          = "0.32.0"
hickory-resolver   = "0.26.3"
file-rotate        = "0.8.0"
tempfile           = "3.27.0"
time               = { version = "0.3.55", default-features = false, features = ["std"] }
regex              = "1.13.1"
httpdate           = "1.0.3"
flate2             = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
brotli             = { version = "9.0.0", default-features = false, features = ["std"] }
h3                 = "0.0.8"
h3-quinn           = "0.0.10"
quinn              = { version = "0.11.12", default-features = false, features = ["rustls-aws-lc-rs", "runtime-tokio", "log"] }
mlua               = { version = "0.12.1", features = ["lua55", "vendored", "serde", "error-send"] }
serde              = { version = "1.0.229", features = ["derive", "rc"] }
serde_json         = "1.0.151"
ipnet              = { version = "2.12.2", features = ["serde"] }
getrandom          = "0.4.3"
rustls             = { version = "0.23.45", features = ["prefer-post-quantum"] }
tokio-rustls       = "0.26.6"
webpki-roots       = "1.0.9"
papaya             = "0.2.5"
ort                = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "api-28"] }
aws-lc-rs          = "1.18.1"
rusqlite           = { version = "0.40.2", features = ["bundled"] }
foldhash           = "0.2.0"
quick_cache        = "0.7.0"
bcrypt = "0.19.3"
base64 = "0.23.1"
zstd = "0.14"
x509-parser = "0.18"
instant-acme = "0.8.5"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
ppp = "2.3.0"

[dev-dependencies]
h2 = "0.4.19"
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
rcgen = "0.14.10"
criterion = "0.8.2"
dashmap = "6.1.0"

[[bench]]
name = "cache"
harness = false

[profile.release]
opt-level        = 3
codegen-units    = 1
debug            = 0
lto              = "fat"
panic            = "abort"
strip            = "symbols"
debug-assertions = false
overflow-checks  = false
incremental      = false

[profile.release.build-override]
opt-level     = 0
codegen-units = 256

[profile.profiling]
inherits = "release"
debug    = 1
strip    = "none"
