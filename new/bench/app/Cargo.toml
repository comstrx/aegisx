[package]
name    = "bench-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
actix-web    = { version = "4", default-features = false, features = ["macros"] }
sqlx         = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "derive"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
futures-util = { version = "0.3", default-features = false }
bytes        = "1"
sha2         = "0.10"
hmac         = "0.12"
hex          = "0.4"
mimalloc     = "0.1"

[profile.release]
opt-level     = 3
codegen-units = 1
lto           = "fat"
panic         = "abort"
debug         = 0
strip         = "symbols"
